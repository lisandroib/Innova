version: "3.1"

nlu:
  - intent: build_cv
    examples: |
      - Quiero armar un CV desde cero
      - Armar un CV
      - Empecemos de cero
      - no tengo cv
      - Queremos armar uno desde cero

  - intent: modify_cv
    examples: |
      - Ya tengo un CV
      - Quiero modificar mi CV
      - Tengo un curriculum
      - Si tenemos un cv

  - intent: affirm_phone
    examples: |
      - Sí, quiero agregar mi teléfono
      - Sí
      - Dale
      - Por supuesto
      - Agrégarlo

  - intent: deny_phone
    examples: |
      - No, gracias
      - No
      - Prefiero no agregarlo
      - No, está bien así

  - intent: inform
    examples: |
      - /inform{"education_level": "sec_incompleto"}
      - /inform{"education_level": "sec_completo"}
      - /inform{"education_level": "curs_grado"}
      - /inform{"education_level": "curs_terciario"}
      - /inform{"education_level": "grad_grado"}
      - /inform{"education_level": "grad_terciario"}
      - /inform{"education_level": "posgrado"}

  - intent: greet
    examples: |
      - Hola
      - Buenas
      - Qué tal
      - Holaa
      - Buen día
      - hey

  - intent: affirm
    examples: |
      - Sí
      - claro
      - si, por favor
      - dale
      - bueno
      - afirmativo

  - intent: deny
    examples: |
      - No
      - no gracias
      - no, dejalo asi
      - para nada
      - negativo
      - no quiero

  # --- ¡ESTO ES LO NUEVO Y MÁS IMPORTANTE! ---
  # Le enseña al NLU lo que NO es un comando.
  - intent: chitchat
    examples: |
      - lisandro ibarra
      - 15 de marzo de 1990
      - tucuman
      - no se
      - bla bla
      - mi nombre es juan
      - cualquier cosa que escriba
      - el cielo es azul